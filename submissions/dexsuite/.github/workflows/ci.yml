# Self-contained CI for the DexSuite project. Run locally with `make test`, or
# copy to the repository root .github/workflows/ to enable on a fork.
name: dexsuite-ci

on:
  push:
    paths: ["submissions/dexsuite/**"]
  pull_request:
    paths: ["submissions/dexsuite/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/dexsuite
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System GL libs (headless EGL rendering)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglfw3
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint-import & model info
        run: python run.py info
      - name: Unit + integration tests
        run: pytest -q tests/
      - name: Headless autonomous task must fully succeed
        run: python run.py autonomous
